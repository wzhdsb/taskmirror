[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskmirror"
version = "0.1.0"
description = "本地优先的 AI 原生任务看板: SQLite 真源 + md 镜像 + MCP, 人类与 agent 共板"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2", "mcp>=1.2"]  # mcp 1.x/2.x 双兼容(见 mcp_server.py)

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
ignore = ["ISC004"]  # md 拼接处刻意用隐式多行字符串连接
